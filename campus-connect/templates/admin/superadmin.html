<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Portal — Campus Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .brand { font-size: 20px; font-weight: 700; color: #38bdf8; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-right a { color: #94a3b8; text-decoration: none; font-size: 14px; }
    .main-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
    .page-title { font-size: 26px; font-weight: 700; margin-bottom: 20px; color: #ffffff; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
    .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .stat-card small { color: #94a3b8; font-size: 13px; text-transform: uppercase; font-weight: 600; }
    .stat-card h3 { font-size: 32px; font-weight: 700; color: #38bdf8; margin-top: 5px; }
    .section-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 25px; margin-bottom: 30px; }
    .section-card h2 { font-size: 18px; margin-bottom: 15px; color: #f1f5f9; display: flex; align-items: center; gap: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #0f172a; padding: 12px 15px; color: #94a3b8; font-size: 13px; text-transform: uppercase; font-weight: 600; }
    td { padding: 12px 15px; border-bottom: 1px solid #334155; font-size: 14px; color: #e2e8f0; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-user { background: #334155; color: #94a3b8; }
    .badge-admin { background: #0284c7; color: #ffffff; }
    .badge-super_admin { background: #9333ea; color: #ffffff; }
    select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 13px; }
    button.btn-action { background: #2563eb; color: white; cursor: pointer; border: none; font-weight: 600; }
    button.btn-action:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/homepage/home" class="brand"><i class="fa-solid fa-shield-halved"></i> Campus Connect Super Admin</a>
    <div class="nav-right">
      <a href="/homepage/home">Return to Home</a>
      <a href="/admin">Admin Dashboard</a>
    </div>
  </nav>

  <div class="main-container">
    <h1 class="page-title">Platform Administration</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <small>Total Users</small>
        <h3 id="statUsers">0</h3>
      </div>
      <div class="stat-card">
        <small>Organizations</small>
        <h3 id="statOrgs">0</h3>
      </div>
      <div class="stat-card">
        <small>Total Complaints</small>
        <h3 id="statComplaints">0</h3>
      </div>
      <div class="stat-card">
        <small>Total Applications</small>
        <h3 id="statApplications">0</h3>
      </div>
    </div>

    <div class="section-card">
      <h2><i class="fa-solid fa-users"></i> User & Organization Access Management</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Current Role</th>
              <th>Assigned Organization</th>
              <th>Update Access</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="6" style="text-align:center; padding:30px;">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let organizations = [];

    async function loadData() {
      try {
        const statsRes = await fetch("/superadmin/stats");
        const statsData = await statsRes.json();
        if(statsData.success) {
          document.getElementById("statUsers").textContent = statsData.stats.total_users;
          document.getElementById("statOrgs").textContent = statsData.stats.total_organizations;
          document.getElementById("statComplaints").textContent = statsData.stats.total_complaints;
          document.getElementById("statApplications").textContent = statsData.stats.total_applications;
        }

        const usersRes = await fetch("/superadmin/users");
        const usersData = await usersRes.json();
        if(usersData.success) {
          organizations = usersData.organizations || [];
          renderUsers(usersData.users || []);
        }
      } catch(err) {
        console.error("Error loading superadmin data:", err);
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById("userTableBody");
      if(!users.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No users registered yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => {
        const orgOptions = organizations.map(o => 
          `<option value="${o.id}" ${u.organization_id == o.id ? 'selected' : ''}>${o.name} (${o.category})</option>`
        ).join('');

        return `
          <tr>
            <td>#${u.id}</td>
            <td><strong>${u.username}</strong></td>
            <td>${u.email}</td>
            <td><span class="badge badge-${u.role}">${u.role.toUpperCase()}</span></td>
            <td>${u.organization_name}</td>
            <td>
              <div style="display:flex; gap:8px;">
                <select id="role-${u.id}">
                  <option value="user" ${u.role === 'user' ? 'selected' : ''}>Student (user)</option>
                  <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Org Admin (admin)</option>
                  <option value="super_admin" ${u.role === 'super_admin' ? 'selected' : ''}>Super Admin</option>
                </select>
                <select id="org-${u.id}">
                  <option value="none">No Organization</option>
                  ${orgOptions}
                </select>
                <button class="btn-action" onclick="saveUserAccess(${u.id})">Save</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function saveUserAccess(userId) {
      const role = document.getElementById(`role-${userId}`).value;
      const orgId = document.getElementById(`org-${userId}`).value;

      try {
        const res = await fetch("/superadmin/users/update-role", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, role: role, organization_id: orgId })
        });
        const data = await res.json();
        alert(data.message);
        if(data.success) loadData();
      } catch(err) {
        alert("Failed to save changes.");
      }
    }

    loadData();
  </script>
</body>
</html>
